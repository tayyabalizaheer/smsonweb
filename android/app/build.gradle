plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
}

android {
    namespace "com.example.smssync"
    compileSdk 35

    defaultConfig {
        applicationId "com.example.smssync"
        minSdk 29
        targetSdk 35
        versionCode 1
        versionName "1.0"

        buildConfigField "String", "SMS_API_URL", "\"https://sms.engrtayyabali.com/api/sms\""
        buildConfigField "String", "SMS_BULK_API_URL", "\"https://sms.engrtayyabali.com/api/sms/bulk\""
        buildConfigField "String", "DEVICE_REGISTER_API_URL", "\"https://sms.engrtayyabali.com/api/devices/register\""
        buildConfigField "String", "DEVICE_PAIRING_CHALLENGE_API_URL", "\"https://sms.engrtayyabali.com/api/devices/pairing-challenge\""
        buildConfigField "String", "DEVICE_HEALTH_API_URL", "\"https://sms.engrtayyabali.com/api/devices/health\""
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }
}

dependencies {
    implementation "androidx.work:work-runtime-ktx:2.9.1"
    implementation "com.squareup.okhttp3:okhttp:4.12.0"
}
