plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
}

android {
    namespace "com.example.smssync"
    compileSdk 35

    defaultConfig {
        applicationId "com.example.smssync"
        minSdk 29
        targetSdk 35
        versionCode 1
        versionName "1.0"

        buildConfigField "String", "SMS_API_URL", "\"http://10.0.2.2:3000/api/sms\""
    }

    buildFeatures {
        buildConfig true
    }

    kotlinOptions {
        jvmTarget = "17"
    }
}

dependencies {
    implementation "com.squareup.okhttp3:okhttp:4.12.0"
}
